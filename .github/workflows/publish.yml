name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Verify provenance metadata
        run: node -e "const p=require('./package.json'); if(p.name!=='@leandjb/osfetch'){console.error('Package name must be @leandjb/osfetch, got '+p.name);process.exit(1)} const raw=String((p.repository||{}).url||''); const url=raw.replace(/^git\\+/,'').replace(/\\.git$/,''); if(url!=='https://github.com/leandjb/osfetch'){console.error('Invalid provenance metadata - package.json repository.url is ['+raw+'] expected to match https://github.com/leandjb/osfetch from provenance. Ensure the release tag points to a commit with valid publish metadata.');process.exit(1)} console.log('Provenance metadata OK - repository.url matches '+url)"
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
